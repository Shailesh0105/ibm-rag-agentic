[project]
name = "triage-api"
version = "0.1.0"
description = "Practice project: LLM ticket triage API (FastAPI + Claude) with an eval harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
