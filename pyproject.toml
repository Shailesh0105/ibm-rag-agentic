[project]
name = "ibm-rag-agentic"
version = "0.1.0"
description = "Learning workspace for IBM's RAG and Agentic AI certificate, rebuilt with current tools"
readme = "README.md"
authors = [
    { name = "Shailesh0105", email = "Shaileshdwivedi0105@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ibm-rag-agentic = "ibm_rag_agentic:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
